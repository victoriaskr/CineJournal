{% extends 'base.html' %}
{% block title %}Анализ интересов{% endblock %}
{% block content %}
<h2>Анализ ваших интересов</h2>
<form method="POST" class="mb-4">
    <div class="row g-3 align-items-end">
        <div class="col-auto">
            <label for="list_name" class="form-label">Выберите список фильмов</label>
            <select name="list_name" id="list_name" class="form-select">
                <option value="">-- выберите список --</option>
                {% for lst in lists %}
                    <option value="{{ lst }}">{{ lst }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Анализировать</button>
        </div>
    </div>
</form>

{% if result is not none %}
    <div class="card">
        <div class="card-header">Результат анализа</div>
        <div class="card-body">
            <p class="card-text">{{ result }}</p>
        </div>
    </div>
{% endif %}
{% endblock %}

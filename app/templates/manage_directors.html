{% extends 'base.html' %}
{% block title %}Режиссёры{% endblock %}
{% block content %}
<h2>Режиссёры</h2>
<a href="{{ url_for('add_director') }}" class="btn btn-primary mb-3">Добавить режиссёра</a>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Имя</th>
            <th>Дата рождения</th>
            <th>Пол</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for d in directors %}
        <tr>
            <td>{{ d[1] }}</td>
            <td>{{ d[2] }}</td>
            <td>{{ d[3] }}</td>
            <td>
                <a href="{{ url_for('edit_director', director_id=d[0]) }}" class="btn btn-warning btn-sm">Ред.</a>
                <form method="POST" action="{{ url_for('delete_director', director_id=d[0]) }}" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Удалить режиссёра?')">Удал.</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4">Нет режиссёров.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

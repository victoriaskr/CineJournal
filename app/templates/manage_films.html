{% extends 'base.html' %}
{% block title %}Фильмы{% endblock %}
{% block content %}
<h2>Фильмы</h2>
<a href="{{ url_for('add_film') }}" class="btn btn-primary mb-3">Добавить фильм</a>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Постер</th>
            <th>Название</th>
            <th>Год</th>
            <th>Режиссёр</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for f in films %}
        <tr>
            <td><img src="{{ url_for('static', filename=f[4]) }}" alt="poster" style="height:60px;"></td>
            <td>{{ f[1] }}</td>
            <td>{{ f[2] }}</td>
            <td>{{ f[3] }}</td>
            <td>
                <a href="{{ url_for('edit_film', film_id=f[0]) }}" class="btn btn-warning btn-sm">Ред.</a>
                <form method="POST" action="{{ url_for('delete_film', film_id=f[0]) }}" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Удалить фильм?')">Удал.</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="5">Нет фильмов.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
